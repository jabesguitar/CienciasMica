
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify content and compile web app
        run: |
          npm run verify
          npm run build

      - name: Create Android platform
        run: npx cap add android

      - name: Apply Android launcher resources
        run: |
          python3 -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install Pillow
          /tmp/ci-venv/bin/python tools/generate_android_icons.py

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CienciasMica-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
